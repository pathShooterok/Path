[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "path-osint"
dynamic = ["version"]
description = "PATH: small OSINT CLI that traces a username across public sources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
keywords = ["osint", "username", "cli", "recon"]

[project.urls]
Homepage = "https://github.com/pathShooterok/Path"
Issues = "https://github.com/pathShooterok/Path/issues"

[project.scripts]
path = "path:main"

[tool.setuptools]
py-modules = ["path"]

[tool.setuptools.packages.find]
include = ["core*", "extractors*", "sources*", "output*"]

[tool.setuptools.package-data]
core = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }
